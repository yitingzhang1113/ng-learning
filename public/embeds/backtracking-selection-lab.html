<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回溯递归树实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap">

<style>
:root{
  --bg:#EDF1F5; --grid:rgba(29,92,150,.055);
  --surface:#FFFFFF; --surface-2:#F5F8FA; --surface-3:#E9EFF4;
  --ink:#12202C; --ink-2:#3B5064; --muted:#6C8398;
  --line:#D2DDE6; --line-soft:#E3EAF0;
  --accent:#1D5C96; --accent-soft:rgba(29,92,150,.11); --accent-ink:#164A79;
  --amber:#A2660C; --amber-soft:rgba(162,102,12,.13);
  --moss:#2F7350; --moss-soft:rgba(47,115,80,.13);
  --rose:#A63C50; --rose-soft:rgba(166,60,80,.12);
  --shadow:0 1px 2px rgba(18,32,44,.06), 0 8px 24px -14px rgba(18,32,44,.28);
  --r:10px;
  --f-serif:"IBM Plex Serif","Songti SC","Noto Serif SC",Georgia,serif;
  --f-sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1520; --grid:rgba(116,182,242,.055);
    --surface:#111D28; --surface-2:#16232F; --surface-3:#1B2A38;
    --ink:#DFE9F1; --ink-2:#AFC2D2; --muted:#7E96AA;
    --line:#25394B; --line-soft:#1D2E3D;
    --accent:#74B6F2; --accent-soft:rgba(116,182,242,.15); --accent-ink:#9CCDFA;
    --amber:#E0A34A; --amber-soft:rgba(224,163,74,.15);
    --moss:#6FC292; --moss-soft:rgba(111,194,146,.15);
    --rose:#E6818F; --rose-soft:rgba(230,129,143,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1520; --grid:rgba(116,182,242,.055);
  --surface:#111D28; --surface-2:#16232F; --surface-3:#1B2A38;
  --ink:#DFE9F1; --ink-2:#AFC2D2; --muted:#7E96AA;
  --line:#25394B; --line-soft:#1D2E3D;
  --accent:#74B6F2; --accent-soft:rgba(116,182,242,.15); --accent-ink:#9CCDFA;
  --amber:#E0A34A; --amber-soft:rgba(224,163,74,.15);
  --moss:#6FC292; --moss-soft:rgba(111,194,146,.15);
  --rose:#E6818F; --rose-soft:rgba(230,129,143,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-serif); font-weight:600; text-wrap:balance; margin:0}
a{color:var(--accent); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- shell ---------- */
.app{
  display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh;
  background-image:linear-gradient(to right, var(--surface) 0 263px, var(--line) 263px 264px, transparent 264px);
}
.rail{position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 0 40px}
.brand{padding:0 22px 18px; border-bottom:1px solid var(--line-soft); margin-bottom:16px}
.brand h1{font-size:19px; letter-spacing:-.01em; line-height:1.3}
.brand .sub{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:7px}
.grp{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:16px 22px 7px; display:flex; gap:8px; align-items:baseline}
.grp::after{content:""; flex:1; height:1px; background:var(--line-soft)}
.navbtn{
  display:flex; gap:10px; align-items:baseline; width:100%; text-align:left;
  background:none; border:0; border-left:2px solid transparent;
  padding:7px 22px 7px 20px; cursor:pointer; color:var(--ink-2);
  font-family:var(--f-sans); font-size:13.5px; line-height:1.45;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn .lc{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); min-width:26px; font-variant-numeric:tabular-nums}
.navbtn.on{background:var(--accent-soft); border-left-color:var(--accent); color:var(--accent-ink); font-weight:600}
.navbtn.on .lc{color:var(--accent)}

main{padding:34px 38px 90px; max-width:1420px}

/* ---------- problem header ---------- */
.phead{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; padding-bottom:16px; border-bottom:1px solid var(--line)}
.phead .num{font-family:var(--f-mono); font-size:34px; font-weight:500; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums}
.phead .tt h2{font-size:26px; letter-spacing:-.015em}
.phead .tt .cn{color:var(--muted); font-size:14px; margin-top:2px}
.tags{display:flex; gap:8px; margin-left:auto; align-items:center}
.tag{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.tag.med{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}
.tag.lk{color:var(--accent); border-color:var(--accent); background:var(--accent-soft); text-decoration:none}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:30px 0 12px; display:flex; align-items:center; gap:10px}
.eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
.idea{padding:18px 22px; font-size:14.5px}
.idea p{margin:0 0 10px}
.idea p:last-child{margin-bottom:0}
.idea code, .ic{font-family:var(--f-mono); font-size:12.5px; background:var(--surface-3); padding:1px 5px; border-radius:4px; color:var(--accent-ink)}
.points{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.pt{background:var(--surface); padding:13px 18px; display:grid; grid-template-columns:118px 1fr; gap:16px; font-size:13.5px}
.pt b{font-weight:600; color:var(--accent-ink); font-size:12.5px; letter-spacing:.02em}
.pt.warn b{color:var(--rose)}
.pt.keep b{color:var(--amber)}

/* ---------- demo layout ---------- */
.demo{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) 366px; align-items:start}
@media (max-width:1180px){ .demo{grid-template-columns:1fr} }

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.ph{display:flex; align-items:baseline; gap:10px; padding:10px 15px; border-bottom:1px solid var(--line-soft)}
.ph h3{font-size:14.5px; letter-spacing:-.01em}
.ph .meta{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--muted)}

/* tree */
.canvas{
  overflow:auto; min-height:300px; max-height:min(66vh,560px);
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
svg.tree{display:block}
.node{
  opacity:0; transform-box:view-box; transform-origin:var(--ox) var(--oy);
  transform:translate(var(--dx),var(--dy)) scale(.4);
  transition:transform .3s cubic-bezier(.33,1.25,.62,1), opacity .22s ease;
}
.node.vis{opacity:1; transform:none}
.node.dim{opacity:.4}
.node .box{fill:var(--surface); stroke:var(--line); stroke-width:1.5; transition:fill .18s, stroke .18s}
.node .lbl{font-family:var(--f-mono); font-size:11.5px; fill:var(--ink-2); text-anchor:middle; dominant-baseline:central}
.node .pick{fill:var(--surface); stroke:var(--line); stroke-width:1.4}
.node .pv{font-family:var(--f-mono); font-size:11px; font-weight:500; fill:var(--muted); text-anchor:middle; dominant-baseline:central}
.node.col .box{fill:var(--moss-soft); stroke:var(--moss); stroke-width:2}
.node.col .lbl{fill:var(--moss); font-weight:600}
.node.spine .box{stroke:var(--accent); stroke-width:2.2}
.node.spine:not(.col) .box{fill:var(--accent-soft)}
.node.spine:not(.col) .lbl{fill:var(--accent-ink)}
.node.cur .box{stroke:var(--accent); stroke-width:2.6; fill:var(--accent-soft)}
.node.cur .lbl{fill:var(--accent-ink); font-weight:600}
.node.cur .pick{stroke:var(--accent); stroke-width:2.2; fill:var(--accent-soft)}
.node.cur .pv{fill:var(--accent-ink); font-weight:600}
.node.skip .pick{stroke:var(--rose); fill:var(--rose-soft); stroke-dasharray:3 2.4}
.node.skip .pv{fill:var(--rose); text-decoration:line-through}
.node.undo .pick{stroke:var(--amber); stroke-width:2.2; fill:var(--amber-soft)}
.node.undo .pv{fill:var(--amber); font-weight:600}
.edge{fill:none; stroke:var(--line); stroke-width:1.6; opacity:0; stroke-dasharray:var(--len); stroke-dashoffset:var(--len); transition:stroke-dashoffset .32s ease, opacity .2s, stroke .18s}
.edge.vis{opacity:1; stroke-dashoffset:0}
.edge.spine{stroke:var(--accent); stroke-width:2.2}
.edge.down{stroke:var(--accent); stroke-width:2.6}
.edge.up{stroke:var(--amber); stroke-width:2.6}
.edge.skip{stroke:var(--rose); stroke-dasharray:4 3; stroke-dashoffset:0}
.edge.skip.vis{opacity:.75}

.note{padding:11px 15px; font-size:13.5px; border-top:1px solid var(--line-soft); display:flex; gap:10px; align-items:flex-start; min-height:46px; background:var(--surface-2)}
.note .badge{font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:99px; flex:none; margin-top:3px; border:1px solid; white-space:nowrap}
.b-enter{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.b-collect{color:var(--moss); border-color:var(--moss); background:var(--moss-soft)}
.b-prune{color:var(--rose); border-color:var(--rose); background:var(--rose-soft)}
.b-back{color:var(--amber); border-color:var(--amber); background:var(--amber-soft)}
.b-boom{color:var(--rose); border-color:var(--rose); background:var(--rose-soft)}
.b-done{color:var(--muted); border-color:var(--line); background:var(--surface-3)}

.ctrl{display:flex; gap:8px; align-items:center; padding:11px 15px; border-top:1px solid var(--line-soft); flex-wrap:wrap}
.btn{font-family:var(--f-sans); font-size:13px; font-weight:500; cursor:pointer; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); border-radius:7px; padding:6px 13px}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff; min-width:74px}
.btn.pri:hover{filter:brightness(1.08); color:#fff}
.btn:disabled{opacity:.45; cursor:default}
.scrub{flex:1; min-width:90px; accent-color:var(--accent)}
.cnt{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.spd{font-family:var(--f-mono); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px}
.spd input{width:62px; accent-color:var(--accent)}

.sabo{display:flex; align-items:center; gap:9px; padding:10px 15px; border-top:1px solid var(--line-soft); background:var(--surface-2); font-size:13.5px; cursor:pointer}
.sabo input{width:15px; height:15px; accent-color:var(--rose); cursor:pointer}
.sabo.on{background:var(--rose-soft); color:var(--rose)}
.legend{display:flex; gap:13px; flex-wrap:wrap; padding:9px 15px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--muted)}
.lg{display:flex; gap:6px; align-items:center}
.sw{width:15px; height:3px; border-radius:2px; background:var(--line); flex:none}
.sw.down{background:var(--accent)} .sw.up{background:var(--amber)} .sw.col{background:var(--moss)}
.sw.skip{background:none; border-top:2px dashed var(--rose); height:0}
.sw.spine{height:11px; width:11px; border-radius:3px; background:var(--accent-soft); border:1px solid var(--accent)}

/* inputs bar */
.bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:11px 15px; border-top:1px solid var(--line-soft)}
.fld{display:flex; align-items:center; gap:8px}
.fld label{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.fld input{font-family:var(--f-mono); font-size:13px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 8px; width:100px}
.fld input.sm{width:54px; text-align:center}
.hintsm{font-size:12px; color:var(--muted); margin-left:auto}

/* code */
.codepane{overflow:auto; max-height:340px; background:var(--surface-2)}
.code{font-family:var(--f-mono); font-size:12.2px; line-height:1.72; padding:10px 0; min-width:max-content}
.cl{display:flex; gap:10px; padding-right:14px; white-space:pre}
.cl .ln{width:30px; text-align:right; color:var(--muted); opacity:.5; user-select:none; border-right:1px solid var(--line-soft); padding-right:7px; flex:none}
.cl.hl{background:var(--accent-soft)}
.cl.hl .ln{opacity:1; color:var(--accent); font-weight:600}
.cl.off{opacity:.4; text-decoration:line-through; text-decoration-color:var(--rose)}
.k{color:var(--accent)} .n{color:var(--amber)} .c{color:var(--muted); font-style:italic}

/* call stack */
.stack{padding:9px 12px; display:flex; flex-direction:column-reverse; gap:5px; max-height:186px; overflow:auto}
.frm{
  font-family:var(--f-mono); font-size:11.4px; line-height:1.5;
  border:1px solid var(--line); border-radius:7px; padding:5px 9px; background:var(--surface-2); color:var(--ink-2);
}
.frm .fi{color:var(--muted)}
.frm.top{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); animation:frmIn .26s ease}
@keyframes frmIn{from{opacity:0; transform:translateY(-9px)} to{opacity:1; transform:none}}
.stack .none{font-size:12px; color:var(--muted); font-family:var(--f-sans); padding:2px}

/* plate */
.plate{margin:11px 12px; border:2px solid var(--accent); border-radius:26px; background:var(--accent-soft); padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; min-height:44px; align-items:center; transition:border-color .2s, background .2s}
.plate.bad{border-color:var(--rose); background:var(--rose-soft)}
.chip{font-family:var(--f-mono); font-size:13px; padding:3px 10px; border-radius:7px; background:var(--surface); color:var(--accent-ink); border:1px solid var(--accent)}
.chip.in{animation:chipIn .3s cubic-bezier(.33,1.3,.62,1)}
.chip.out{animation:chipOut .3s ease forwards; border-color:var(--amber); color:var(--amber)}
.chip.ghost{border-style:dashed}
@keyframes chipIn{from{opacity:0; transform:translateY(-16px) scale(.6)} to{opacity:1; transform:none}}
@keyframes chipOut{from{opacity:1; transform:none} to{opacity:0; transform:translateY(18px) scale(.6)}}
.plate .empty{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.pwarn{margin:0 12px 11px; font-size:12.5px; color:var(--rose); display:flex; gap:6px}
.usedrow{margin:0 12px 11px; display:flex; gap:6px; align-items:center; font-family:var(--f-mono); font-size:11.5px; color:var(--muted); flex-wrap:wrap}
.ub{padding:1px 7px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2)}
.ub.t{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}

/* res */
.reslist{padding:10px 12px; display:flex; gap:6px; flex-wrap:wrap; max-height:150px; overflow:auto}
.rchip{font-family:var(--f-mono); font-size:11.5px; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line-soft)}
.rchip.new{background:var(--moss-soft); color:var(--moss); border-color:var(--moss); font-weight:600}
.rchip.bad{background:var(--rose-soft); color:var(--rose); border-color:var(--rose)}
.err{padding:24px; color:var(--rose); font-size:14px}

/* compare */
.tbwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:760px; font-size:13.3px}
th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500; background:var(--surface-2)}
td code{font-family:var(--f-mono); font-size:12px; background:var(--surface-3); padding:1px 5px; border-radius:4px; color:var(--accent-ink)}
tr:last-child td{border-bottom:0}
.tpl{padding:18px 22px; font-family:var(--f-mono); font-size:12.5px; line-height:1.8; white-space:pre; overflow-x:auto}
.foot{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}

.themebtn{position:fixed; right:18px; bottom:18px; z-index:20; width:38px; height:38px; border-radius:50%; cursor:pointer; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); color:var(--ink-2); font-size:15px}
.themebtn:hover{border-color:var(--accent); color:var(--accent)}

@media (max-width:820px){
  .app{grid-template-columns:1fr; background-image:none}
  .rail{position:static; height:auto; background:var(--surface); border-bottom:1px solid var(--line)}
  main{padding:22px 16px 70px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important; scroll-behavior:auto !important} }
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>回溯递归树实验室</h1>
      <div class="sub">Backtracking · 9 problems</div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<button class="themebtn" id="themebtn" title="切换主题" aria-label="切换明暗主题">◐</button>

<script>
/* ============================================================
   1. Trace 引擎
   ============================================================ */
var LAST_T = null;
function T(codeStr, noPop){
  var t = {
    code: codeStr.split("\n"), noPop: !!noPop,
    cap: noPop ? 44 : 2400,
    nodes: [], steps: [], path: [], res: [], stack: [], used: null,
    line: function(sub){ return this.code.findIndex(function(l){ return l.indexOf(sub) >= 0; }); },
    node: function(parent, choice, kind){
      var n = { id:this.nodes.length, parent:parent, choice:String(choice), kind:kind||"call",
                depth: parent==null ? 0 : this.nodes[parent].depth+1, children:[] };
      this.nodes.push(n);
      if(parent != null) this.nodes[parent].children.push(n.id);
      return n.id;
    },
    push: function(sig){ this.stack.push({ sig:sig, i:null }); },
    top: function(){ return this.stack[this.stack.length-1]; },
    drop: function(){ this.stack.pop(); },
    undo: function(){ if(!this.noPop) this.path.pop(); },
    step: function(node, kind, note, sub){
      if(this.steps.length >= this.cap) throw new Error(this.noPop ? "BLOWUP" : "TOO_BIG");
      this.steps.push({ node:node, kind:kind, note:note, line:this.line(sub),
        path:this.path.slice(), res:this.res.map(function(r){return r.slice();}),
        stack:this.stack.map(function(f){ return { sig:f.sig, i:f.i }; }),
        used:this.used ? this.used.slice() : null });
    },
    finish: function(){
      this.steps.push({ node:0, kind:"done",
        note:"搜索结束，backtrack 全部返回，res 共 " + this.res.length + " 个结果。",
        line:-1, path:this.path.slice(), res:this.res.map(function(r){return r.slice();}),
        stack:[], used:this.used ? this.used.slice() : null });
    }
  };
  LAST_T = t; return t;
}
var P = function(a){ return "[" + a.join(",") + "]"; };
function backNote(t, v){
  return t.noPop
    ? "❌ path.pop() 被注释掉了：" + v + " 没有被撤销，path 继续留着它 → " + P(t.path) + "。"
    : "撤销选择：path 弹出 " + v + " → " + P(t.path) + "，回到父节点继续下一个 i。";
}

/* --- 78 Subsets --- */
function tr_subsets(code, v, noPop){
  var t = T(code, noPop), nums = v.nums.slice().sort(function(a,b){return a-b;});
  var root = t.node(null, "", "root");

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var KW = /\b(def|for|in|range|if|else|elif|return|not|and|or|continue|break|class|self|len|set|add|sort|copy|append|pop|None|True|False|List|int)\b/g;
function hlLine(line){
  var ci = line.indexOf("#");
  var codePart = ci >= 0 ? line.slice(0, ci) : line;
  var com = ci >= 0 ? line.slice(ci) : "";
  var out = esc(codePart).replace(KW, function(m){ return "<span class='k'>" + m + "</span>"; })
                         .replace(/\b(\d+)\b/g, "<span class='n'>$1</span>");
  if(com) out += "<span class='c'>" + esc(com) + "</span>";
  return out;
}

function readInputs(p){
  var v = {};
  p.inputs.forEach(function(f){
    var el = $("#f_" + f.id);
    if(f.kind === "arr"){
      var arr = el.value.split(/[,，\s]+/).map(Number).filter(function(x){ return !isNaN(x); });
      if(!arr.length) arr = [1,2,3];
      if(arr.length > f.max){ arr = arr.slice(0, f.max); }
      el.value = arr.join(",");
      v[f.id] = arr;
    } else {
      var n = parseInt(el.value, 10);
      if(isNaN(n)) n = f.def;
      n = Math.max(f.min, Math.min(f.max, n));
      el.value = n; v[f.id] = n;
    }
  });
  if(p.key === "combine" && v.k > v.n){ v.k = v.n; $("#f_k").value = v.k; }
  return v;
}

var VIZ = null;
function build(p){
  stop();
  var vals = readInputs(p), t = null, blew = false;
  try{ t = p.trace(p.code, vals, SABO); }
  catch(err){
    if(err.message === "BLOWUP"){
      t = LAST_T; blew = true;
      t.steps.push({ node:t.steps[t.steps.length-1].node, kind:"boom",
        note:"path 只增不减，递归已经跑飞了 —— 演示在第 " + t.steps.length + " 步停下。真实运行下去要么答案全错，要么一路涨到爆栈。",
        line:t.line("path.pop()"), path:t.path.slice(), res:t.res.map(function(r){return r.slice();}),
        stack:t.stack.map(function(f){ return { sig:f.sig, i:f.i }; }), used:t.used ? t.used.slice() : null });
    } else {
      $("#canvas").innerHTML = "<div class='err'>这组输入展开的递归树太大了，换小一点的输入再试。</div>";
      return;
    }
  }
  var nodes = t.nodes, steps = t.steps;

  /* 每个节点在树上的位置路径 */
  var tp = nodes.map(function(){ return null; });
  nodes.forEach(function(n){ tp[n.id] = n.parent == null ? [] : tp[n.parent].concat([n.choice]); });
  var label = nodes.map(function(n){ return n.kind === "skip" ? "" : "[" + tp[n.id].join(",") + "]"; });

  /* 布局 */
  var X = new Array(nodes.length).fill(0), leaf = 0, maxd = 0;
  (function walk(id){
    var n = nodes[id]; if(n.depth > maxd) maxd = n.depth;
    if(!n.children.length){ X[id] = leaf++; }
    else { n.children.forEach(walk); X[id] = (X[n.children[0]] + X[n.children[n.children.length-1]]) / 2; }
  })(0);
  var boxW = label.map(function(s){ return s ? Math.max(32, s.length * 7.1 + 15) : 0; });
  var CW = Math.max(48, Math.max.apply(null, boxW) + 16);
  var RH = 76, BH = 26, MX = 26, MY = 26, PR = 13;
  var W = MX*2 + Math.max(1, leaf)*CW, H = MY*2 + maxd*RH + BH;
  var pos = nodes.map(function(n, i){ return { x: MX + (X[i] + 0.5)*CW, y: MY + n.depth*RH + BH/2 }; });

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "tree");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  var edgeEls = new Array(nodes.length), nodeEls = new Array(nodes.length);
  nodes.forEach(function(n){
    if(n.parent == null) return;
    var a = pos[n.parent], b = pos[n.id];
    var y1 = a.y + BH/2, y2 = n.kind === "skip" ? (a.y + b.y)/2 : b.y - BH/2;
    var my = (y1 + y2) / 2;
    var e = document.createElementNS(NS, "path");
    e.setAttribute("d", "M" + a.x + "," + y1 + " C" + a.x + "," + my + " " + b.x + "," + my + " " + b.x + "," + y2);
    e.setAttribute("class", "edge" + (n.kind === "skip" ? " skip" : ""));
    svg.appendChild(e); edgeEls[n.id] = e;
    try{ e.style.setProperty("--len", e.getTotalLength() || 90); }catch(err){ e.style.setProperty("--len", 90); }
  });
  nodes.forEach(function(n){
    var g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (n.kind === "skip" ? " skip" : ""));
    var px = pos[n.id].x, py = pos[n.id].y;
    var ax = n.parent == null ? px : pos[n.parent].x, ay = n.parent == null ? py - 24 : pos[n.parent].y;
    g.style.setProperty("--ox", px + "px"); g.style.setProperty("--oy", py + "px");
    g.style.setProperty("--dx", (ax - px) * 0.35 + "px"); g.style.setProperty("--dy", (ay - py) * 0.35 + "px");
    if(n.parent != null){
      var cy = n.kind === "skip"
        ? (pos[n.parent].y + BH/2 + (pos[n.id].y + pos[n.parent].y)/2) / 2
        : (pos[n.parent].y + BH/2 + pos[n.id].y - BH/2) / 2;
      var cx = (pos[n.parent].x + px) / 2;
      var pc = document.createElementNS(NS, "circle");
      pc.setAttribute("class", "pick"); pc.setAttribute("cx", cx); pc.setAttribute("cy", cy); pc.setAttribute("r", PR);
      var pt = document.createElementNS(NS, "text");
      pt.setAttribute("class", "pv"); pt.setAttribute("x", cx); pt.setAttribute("y", cy + 0.5);
      pt.textContent = n.choice;
      g.appendChild(pc); g.appendChild(pt);
    }
    if(n.kind !== "skip"){
      var w = boxW[n.id];
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("class", "box"); r.setAttribute("x", px - w/2); r.setAttribute("y", py - BH/2);
      r.setAttribute("width", w); r.setAttribute("height", BH); r.setAttribute("rx", 7);
      var tx = document.createElementNS(NS, "text");
      tx.setAttribute("class", "lbl"); tx.setAttribute("x", px); tx.setAttribute("y", py + 0.5);
      tx.textContent = label[n.id] === "[]" ? "[ ]" : label[n.id];
      g.appendChild(r); g.appendChild(tx);
    }
    svg.appendChild(g); nodeEls[n.id] = g;
  });
  var canvas = $("#canvas");
  canvas.innerHTML = ""; canvas.appendChild(svg);
  canvas.scrollLeft = Math.max(0, (W - canvas.clientWidth) / 2);

  var firstAt = new Array(nodes.length).fill(Infinity),
      colAt   = new Array(nodes.length).fill(Infinity),
      backAt  = new Array(nodes.length).fill(Infinity);
  steps.forEach(function(s, i){
    if(i < firstAt[s.node]) firstAt[s.node] = i;
    if(s.kind === "collect" && i < colAt[s.node]) colAt[s.node] = i;
    if(s.kind === "back" && i < backAt[s.node]) backAt[s.node] = i;
  });

  VIZ = { t:t, steps:steps, nodes:nodes, pos:pos, nodeEls:nodeEls, edgeEls:edgeEls, tp:tp,
          firstAt:firstAt, colAt:colAt, backAt:backAt, cur:-1, canvas:canvas, blew:blew, shown:null };

  $("#sigBox").textContent = p.sig.replace(/\(.*\)/, "(" + p.inputs.map(function(f){
    return Array.isArray(vals[f.id]) ? "[" + vals[f.id].join(",") + "]" : vals[f.id];
  }).join(", ") + ")");
  var scrub = $("#scrub");
  scrub.max = steps.length - 1; scrub.value = 0;
  scrub.oninput = function(){ stop(); draw(parseInt(scrub.value, 10)); };
  $("#btnFirst").onclick = function(){ stop(); draw(0); };
  $("#btnPrev").onclick  = function(){ stop(); draw(VIZ.cur - 1); };
  $("#btnNext").onclick  = function(){ stop(); draw(VIZ.cur + 1); };
  $("#btnPlay").onclick  = toggle;
  draw(0);
}

var BADGE = { enter:["b-enter","做选择"], collect:["b-collect","收集"], prune:["b-prune","剪枝"],
              back:["b-back","撤销"], boom:["b-boom","跑飞了"], done:["b-done","结束"] };
var ghostTimer = null;

function draw(i){
  if(!VIZ) return;
  var steps = VIZ.steps;
  i = Math.max(0, Math.min(steps.length - 1, i));
  var prevIdx = VIZ.cur;
  VIZ.cur = i;
  var s = steps[i];

  /* 当前递归栈 = 从根到当前节点的一串 */
  var spine = {}, cursor = s.node;
  while(cursor != null){ spine[cursor] = 1; cursor = VIZ.nodes[cursor].parent; }

  VIZ.nodes.forEach(function(n){
    var g = VIZ.nodeEls[n.id], vis = VIZ.firstAt[n.id] <= i;
    g.classList.toggle("vis", vis);
    g.classList.toggle("cur", s.node === n.id && s.kind !== "back");
    g.classList.toggle("undo", s.node === n.id && s.kind === "back");
    g.classList.toggle("col", VIZ.colAt[n.id] <= i);
    g.classList.toggle("spine", !!spine[n.id] && s.node !== n.id);
    g.classList.toggle("dim", VIZ.backAt[n.id] <= i && s.node !== n.id);
    var e = VIZ.edgeEls[n.id];
    if(e){
      e.classList.toggle("vis", vis);
      e.classList.toggle("spine", !!spine[n.id] && n.kind !== "skip");
      e.classList.toggle("down", s.node === n.id && s.kind === "enter");
      e.classList.toggle("up", s.node === n.id && s.kind === "back");
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll("#codeBox .cl"), function(el){
    el.classList.toggle("hl", parseInt(el.dataset.i, 10) === s.line);
  });

  var b = BADGE[s.kind] || BADGE.enter;
  $("#note").innerHTML = "<span class='badge " + b[0] + "'>" + b[1] + "</span><span>" + esc(s.note) + "</span>";

  /* 调用栈 */
  var st = s.stack || [];
  $("#depthBox").textContent = "深度 " + st.length;
  $("#stackBox").innerHTML = st.length
    ? st.map(function(f, j){
        return "<div class='frm" + (j === st.length-1 ? " top" : "") + "'>" + esc(f.sig) +
               (f.i != null ? "<span class='fi'>　i = " + f.i + "</span>" : "") + "</div>";
      }).join("")
    : "<div class='none'>栈已清空，backtrack 全部返回。</div>";

  /* 盘子 path */
  var prev = prevIdx >= 0 && prevIdx < steps.length ? steps[prevIdx].path : [];
  var grew = s.path.length === prev.length + 1;
  var shrank = s.path.length === prev.length - 1;
  var html = s.path.length
    ? s.path.map(function(x, j){
        return "<span class='chip" + (grew && j === s.path.length-1 ? " in" : "") + "'>" + x + "</span>";
      }).join("")
    : "<span class='empty'>（空盘子）</span>";
  if(shrank) html += "<span class='chip out ghost'>" + prev[prev.length-1] + "</span>";
  var plate = $("#plate");
  plate.innerHTML = html;
  $("#plateN").textContent = "len " + s.path.length;
  var truth = VIZ.tp[s.node].join(","), actual = s.path.join(",");
  var bad = truth !== actual;
  plate.classList.toggle("bad", bad);
  clearTimeout(ghostTimer);
  if(shrank) ghostTimer = setTimeout(function(){
    var gh = plate.querySelector(".ghost"); if(gh) gh.remove();
  }, 340);

  var extra = "";
  if(bad) extra += "<div class='pwarn'><span>⚠</span><span>盘子和树上的位置对不上了 —— 当前节点是 [" +
      esc(truth) + "]，盘子里却是 [" + esc(actual) + "]。</span></div>";
  if(s.used) extra += "<div class='usedrow'><span>used</span>" + s.used.map(function(u, j){
      return "<span class='ub" + (u ? " t" : "") + "'>" + j + ":" + (u ? "T" : "F") + "</span>";
    }).join("") + "</div>";
  $("#extra").innerHTML = extra;

  /* res */
  var n0 = s.res.length, pn = prevIdx >= 0 && prevIdx < steps.length ? steps[prevIdx].res.length : 0;
  $("#resN").textContent = n0 + " 个";
  $("#resBox").innerHTML = n0
    ? s.res.map(function(r, j){
        var cls = (j === n0-1 && n0 > pn ? " new" : "") + (VIZ.t.noPop ? " bad" : "");
        return "<span class='rchip" + cls + "'>[" + r.join(",") + "]</span>";
      }).join("")
    : "<span class='rchip'>（空）</span>";

  $("#cnt").textContent = (i+1) + " / " + steps.length;
  $("#scrub").value = i;
  $("#btnPrev").disabled = i === 0;
  $("#btnNext").disabled = i === steps.length - 1;

  var x = VIZ.pos[s.node].x, y = VIZ.pos[s.node].y, c = VIZ.canvas;
  if(x < c.scrollLeft + 70 || x > c.scrollLeft + c.clientWidth - 70)
    c.scrollTo({ left: x - c.clientWidth/2, behavior:"smooth" });
  if(y < c.scrollTop + 50 || y > c.scrollTop + c.clientHeight - 50)
    c.scrollTo({ top: y - c.clientHeight/2, behavior:"smooth" });

  if(playing && i >= steps.length - 1) stop();
}

var playing = false, timer = null;
function toggle(){ playing ? stop() : play(); }
function play(){
  if(!VIZ) return;
  if(VIZ.cur >= VIZ.steps.length - 1) draw(0);
  playing = true;
  var pb = document.getElementById("btnPlay"); if(pb) pb.textContent = "暂停";
  var d = [1100, 850, 620, 450, 300, 190][(parseInt($("#spd").value, 10) || 3) - 1];
  timer = setInterval(function(){ draw(VIZ.cur + 1); }, d);
}
function stop(){
  playing = false; clearInterval(timer); timer = null;
  var b = document.getElementById("btnPlay"); if(b) b.textContent = "播放";
}

document.addEventListener("keydown", function(e){
  if(!VIZ || curKey === "__cmp") return;
  if(/input|textarea/i.test(e.target.tagName)) return;
  if(e.key === "ArrowRight"){ stop(); draw(VIZ.cur + 1); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ stop(); draw(VIZ.cur - 1); e.preventDefault(); }
  else if(e.key === " "){ toggle(); e.preventDefault(); }
});

function renderCompare(){
  VIZ = null; stop();
  var rows = [
    ["78 Subsets","start / i+1","无","每个节点","—"],
    ["90 Subsets II","start / i+1","<code>i &gt; start and nums[i]==nums[i-1]</code>（同层）","每个节点","先 sort"],
    ["491 Non-decreasing","start / i+1","<code>本层 used = set()</code>（同层）","len(path) ≥ 2","不能 sort"],
    ["77 Combinations","start / i+1","无","len(path) == k","<code>i ≤ n-(k-len)+1</code>"],
    ["39 Comb. Sum","start / <b>i</b>（可重复）","无","cur_sum == target","<code>sum+c[i] &gt; target → break</code>"],
    ["40 Comb. Sum II","start / i+1","<code>i &gt; start_index and c[i]==c[i-1]</code>（同层）","cur_sum == target","break + 先 sort"],
    ["216 Comb. Sum III","start / i+1","无（1..9 互异）","len==k <b>且</b> sum==n","<code>sum+num &gt; n → break</code>"],
    ["46 Permutations","<b>无 start</b> / used[]","无","len(path)==len(nums)","—"],
    ["47 Permutations II","<b>无 start</b> / used[]","<code>nums[i]==nums[i-1] and not used[i-1]</code>（同层）","len(path)==len(nums)","先 sort"]
  ].map(function(r){
    return "<tr><td><b>" + r[0] + "</b></td><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td><td>" + r[4] + "</td></tr>";
  }).join("");

  mainEl.innerHTML =
    "<header class='phead'><div class='num'>≡</div>" +
      "<div class='tt'><h2>模板对比</h2><div class='cn'>九道题其实是同一段骨架的九种参数</div></div></header>" +
    "<div class='eyebrow'>骨架 · the skeleton</div>" +
    "<div class='card tpl'>" + hlLine("def backtrack(参数):") + "\n" +
      hlLine("    if 终止条件:") + "\n" +
      hlLine("        res.append(path[:])   # 拷贝！") + "\n" +
      hlLine("        return") + "\n" +
      hlLine("    for i in 本层候选集:") + "\n" +
      hlLine("        if 剪枝条件: break / continue") + "\n" +
      hlLine("        path.append(选择)      # 做选择") + "\n" +
      hlLine("        backtrack(下一层参数)   # 递归") + "\n" +
      hlLine("        path.pop()            # 撤销选择") +
    "</div>" +
    "<div class='eyebrow'>九题速查 · cheat sheet</div>" +
    "<div class='tbwrap'><table><thead><tr><th>题目</th><th>取数方式</th><th>去重</th><th>收集时机</th><th>剪枝</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
    "<div class='eyebrow'>三条主线 · what actually varies</div>" +
    "<div class='points'>" +
      "<div class='pt'><b>取数方式</b><span>组合类用 <span class='ic'>start</span> 砍掉左边（传 i+1 = 用一次，传 i = 可重复）；排列类没有 start，每层从 0 扫全部，用 <span class='ic'>used[]</span> 标记纵向已用。这是组合与排列的根本分界。</span></div>" +
      "<div class='pt warn'><b>去重的方向</b><span>有重复元素时，要去掉的永远是<b>同一层</b>的重复取值，不是同一条枝。<span class='ic'>i &gt; start</span>（组合）和 <span class='ic'>not used[i-1]</span>（排列）说的是同一件事，只是一个靠下标区分层、一个靠标记区分层。前提都是先排序；491 因为不能排序，改用本层局部 set。</span></div>" +
      "<div class='pt keep'><b>做选择 / 撤销选择</b><span>append 和 pop 必须严格成对——每个演示里都有一个「把 path.pop() 注释掉」的开关，勾上就能看到盘子只增不减、树上的位置和 path 彻底对不上、res 里全是垃圾。排列还要多撤一件事：<span class='ic'>used[i] = False</span>。</span></div>" +
    "</div>" +
    "<div class='foot'>九道题，一套骨架。写不出来的时候先画树：本层候选集是什么、什么时候收割、哪一刀砍横向哪一刀砍纵向。</div>";
}

(function(){
  var btn = $("#themebtn"), stored = null;
  try{ stored = localStorage.getItem("bt-theme"); }catch(e){}
  if(stored) document.documentElement.setAttribute("data-theme", stored);
  btn.addEventListener("click", function(){
    var root = document.documentElement, now = root.getAttribute("data-theme");
    var isDark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("bt-theme", next); }catch(e){}
  });
})();

var initial = (location.hash || "").slice(1);
var valid = PROBLEMS.some(function(p){ return p.key === initial; }) || initial === "__cmp";
go(valid ? initial : PROBLEMS[0].key);
</script>
